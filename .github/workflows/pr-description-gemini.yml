name: Generate PR Description with Gemini

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  describe-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener Diff Optimizado (Ahorro de Tokens)
        id: get_diff
        run: |
          # Obtenemos el diff contra la rama base excluyendo archivos masivos o innecesarios
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD \
            -- . \
            ':!package-lock.json' \
            ':!yarn.lock' \
            ':!pnpm-lock.yaml' \
            ':!*.svg' \
            ':!*.png' \
            ':!*.jpg' \
            ':!*.pdf')
          
          # Si el diff supera los 15.000 caracteres, lo recortamos para proteger tokens
          echo "$DIFF" | head -c 15000 > diff.txt

      - name: Llamar a la API de Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="Actúa como un Tech Lead. Analiza el siguiente git diff de un Pull Request y redacta una descripción en Markdown estructurada con:
          1. Resumen ejecutivo conciso (1 párrafo).
          2. Tipo de cambio (Feature, Fix, Refactor, Docs, etc.).
          3. Lista de cambios clave organizados por viñetas.
          4. Módulos o componentes impactados.

          Diff:
          $(cat diff.txt)"

          # Escapar el contenido para el payload JSON
          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" '{
            contents: [{
              parts: [{ text: $prompt }]
            }],
            generationConfig: {
              temperature: 0.2,
              maxOutputTokens: 1000
            }
          }')

          # Llamada directa al endpoint de Gemini
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          # Extraer el texto generado
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -n "$DESCRIPTION" ]; then
            echo "$DESCRIPTION" > pr_description.md
          else
            echo "Error o respuesta vacía de la API de Gemini."
            exit 1
          fi

      - name: Actualizar descripción del PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --body-file pr_description.md
