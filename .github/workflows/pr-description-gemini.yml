name: Generate PR Description with Gemini

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  describe-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener Diff Optimizado
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD \
            -- . \
            ':!package-lock.json' \
            ':!yarn.lock' \
            ':!pnpm-lock.yaml' \
            ':!*.svg' \
            ':!*.png' \
            ':!*.jpg' \
            ':!*.pdf')
          
          echo "$DIFF" | head -c 15000 > diff.txt

      - name: Llamar a la API de Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          INSTRUCTIONS="Actua como un Tech Lead. Analiza el siguiente git diff de un Pull Request y redacta una descripcion en Markdown estructurada con:
          1. Resumen ejecutivo conciso (1 parrafo).
          2. Tipo de cambio (Feature, Fix, Refactor, Docs, etc.).
          3. Lista de cambios clave organizados por vinetas.
          4. Modulos o componentes impactados.

          Diff:
          "

          # 1. Crear el archivo JSON con jq de forma limpia y segura
          jq -n \
            --arg instructions "$INSTRUCTIONS" \
            --rawfile diffContent diff.txt \
            '{
              contents: [{
                parts: [{
                  text: ($instructions + $diffContent)
                }]
              }],
              generationConfig: {
                temperature: 0.2,
                maxOutputTokens: 1000
              }
            }' > payload.json

          # 2. Enviar la peticion a Gemini
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @payload.json)


          # 3. Comprobar si hubo error devuelto por la API
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$API_ERROR" ]; then
            echo "::error::Error devuelto por Gemini API: $API_ERROR"
            echo "$RESPONSE"
            exit 1
          fi

          # 4. Extraer el texto generado
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -n "$DESCRIPTION" ]; then
            echo "$DESCRIPTION" > pr_description.md
          else
            echo "::error::Respuesta vacia o estructura desconocida."
            echo "$RESPONSE"
            exit 1
          fi

      - name: Actualizar descripcion del PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --body-file pr_description.md
